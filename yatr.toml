# yatr - https://github.com/cargopete/yatr
#
# CI calls these tasks by name, so `yatr ci` locally is the same gate.

[env]
CARGO_TERM_COLOR = "always"

[tasks.fmt]
desc = "Format the tree"
run = ["cargo fmt --all"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the tree is unformatted (CI: core)"
run = ["cargo fmt --all --check"]
sources = ["crates/**/*.rs"]

[tasks.test-core]
desc = "Tests for the crates that do not link Qt (CI: core)"
run = ["cargo test --locked -p nest-client -p desk-core -p mock-nest"]
sources = ["crates/nest-client/**", "crates/desk-core/**", "crates/mock-nest/**", "Cargo.toml", "Cargo.lock", ".cargo/config.toml"]

# The advisory database moves without the tree changing, so this is never a cache hit.
[tasks.deny]
desc = "Licences, advisories and sources against deny.toml (CI: core)"
run = ["cargo deny check"]
no_cache = true

# The bridge's build script writes the QML type information qmllint reads, so a cache hit has to
# put it back.
[tasks.build]
desc = "Debug build of the whole workspace, Qt included"
run = ["cargo build --locked"]
sources = ["crates/**", "Cargo.toml", "Cargo.lock", ".cargo/config.toml"]
outputs = ["target/cxxqt/qml_modules/**"]
env_inputs = ["QMAKE"]

[tasks.lint]
desc = "Clippy with warnings denied (CI: linux, macos)"
run = ["cargo clippy --workspace --all-targets --locked -- -D warnings"]
sources = ["crates/**", "Cargo.toml", "Cargo.lock", ".cargo/config.toml"]
env_inputs = ["QMAKE"]

[tasks.test]
desc = "Every test, the headless QML ones included (CI: linux, macos, windows)"
run = ["cargo test --workspace --locked"]
sources = ["crates/**", "Cargo.toml", "Cargo.lock", ".cargo/config.toml"]
env_inputs = ["QMAKE"]
watch = ["crates/**"]

[tasks.qmllint]
desc = "qmllint over the client's QML (CI: linux, macos)"
depends = ["build"]
run = ["tools/lint-qml.sh"]
sources = ["crates/desk/qml/**", "tools/lint-qml.sh"]

[tasks.ci]
desc = "Every CI gate: fmt-check, test-core, deny, lint, test, qmllint"
depends = ["fmt-check", "test-core", "deny", "lint", "test", "qmllint"]
